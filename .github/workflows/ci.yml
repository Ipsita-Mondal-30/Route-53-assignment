# CI — install deps, alembic upgrade against throwaway SQLite, pytest (80% cov).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Alembic upgrade (throwaway SQLite)
        env:
          DATABASE_URL: sqlite:////tmp/route53-ci.db
          SESSION_SECRET: ci-secret
          ENVIRONMENT: dev
          CORS_ORIGINS: http://localhost:3000
          SEED_SAMPLE_DNS: "0"
        run: poetry run alembic upgrade head

      - name: Pytest (coverage >= 80%)
        env:
          SEED_SAMPLE_DNS: "0"
          SESSION_SECRET: ci-secret
          ENVIRONMENT: dev
          CORS_ORIGINS: http://localhost:3000
        run: poetry run pytest
