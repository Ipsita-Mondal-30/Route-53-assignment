services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/route53.db
      SESSION_SECRET: change-me-docker-secret
      SESSION_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      ENVIRONMENT: dev
      DEMO_USER_EMAIL: demo@example.com
      DEMO_USER_PASSWORD: DemoPass123!
      SEED_SAMPLE_DNS: "1"
    volumes:
      # Persist SQLite across container restarts
      - route53_sqlite:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  route53_sqlite:
